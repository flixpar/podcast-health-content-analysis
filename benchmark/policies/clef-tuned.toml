# Clef (27B): clef-efficient (pre-gate, coarse-to-fine localization) with the
# composition thresholds re-tuned on the benchmark's dev split for Clef's
# probabilities (analysis/benchmark/typesafe_tune.py over benchmark/runs/clef-eff).
# Clef's run lower than Jev's: seeds of 0.5-0.6 and a claim threshold of 0.4.
# Test split, not tuned on: topic F1 0.670, frame 0.552, evidence 0.631, claim
# recall 0.705 at precision 0.674, product 0.535 (docs/clef-labeling.md).
pregate = true
refine = true
claim_threshold = 0.4
max_claim_units = 3
product_name_threshold = 0.5

[bridge_units]
evidence = 1
frame = 1
topic = 0

[extend_threshold]
evidence = 0.2
frame = 0.2
topic = 0.5

[seed_threshold]
evidence = 0.6
frame = 0.5
topic = 0.6

[window_threshold]
evidence = 0.1
frame = 0.1
topic = 0.1
