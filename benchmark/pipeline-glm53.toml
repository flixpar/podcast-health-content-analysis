# Candidate configuration for benchmark runs against the local GLM-5.3-Flash
# server (analysis/serving/serve-glm53.sh, port 8222). Same settings as
# analysis/topic-labeling-glm53.toml; typed flags after `--` win.
#
#   BENCHMARK_DIR=benchmark/v3 .venv/bin/python -m analysis.benchmark run --name glm53-high \
#       --pipeline-config benchmark/pipeline-glm53.toml --repeats 1 --split all

[model]
api_base = ["http://127.0.0.1:8222/v1"]
api = "chat_completions"
model = "glm53-w4"
reasoning_effort = "high"
max_output_tokens = 40000
timeout = 7200
attempts = 3
temperature = 1.0
top_p = 0.95

[label]
concurrency = 448
validation = "lenient"
thinking_token_budget = 24000
