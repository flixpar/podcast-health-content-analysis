[project]
name = "podcast-misinfo"
version = "0.1.0"
description = "Podcast collection, transcription, and misinformation analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "feedparser>=6.0.11",
    "lxml>=6.1.2",
    "nemo-toolkit[asr]>=3.0,<3.1",
    "numpy>=2.0",
    "requests>=2.32.4",
    "sentencepiece>=0.2.1",
    "silero-vad==5.1.2",
    "torch==2.12.1",
    "torchaudio==2.11.0+cu126",
    "tqdm>=4.67.1",
    "zstandard>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# analysis/benchmark reads the lexical scan's parquet and uses Hungarian
# matching; these were already in the venv but undeclared.
analysis = [
    "pyarrow>=17",
    "scipy>=1.14",
    "pandas>=2.2",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
