# Settings for the DeepSeek-V4-Flash-0731 labeling pilot. Read by default from
# the repository root, so the commands in the runbook need no endpoint flags:
#
#   .venv/bin/python analysis/topic_labeling.py label
#
# Values become ordinary flags, so anything typed on the command line wins:
#
#   .venv/bin/python analysis/topic_labeling.py label --reasoning-effort high
#
# Pass --config to use a different file. Output-affecting settings enter the run
# fingerprint, so changing them requires a fresh output directory. See
# docs/labeling.md for the current workflow.

# Where the run reads and writes. Every command takes what applies to it, and
# every artifact inside the run directory follows output_dir, so moving a run
# means changing one line here rather than five flags per command.
[paths]
topics = "taxonomy/health-v8.md"
transcripts = "downloader/data/transcripts"
output_dir = "local/topic-labeling"
# metadata_db = "downloader/data/podcast_metadata.db"

# Shared by `label` and `verify`; a [label] or [verify] key below overrides it.
[model]
# One entry per identical vLLM server; requests round-robin across them and a
# retry lands on a different one. They must all serve the same model: the run
# refuses to start otherwise, because a run split across two checkpoints cannot
# be attributed afterwards. Endpoints are capacity, so they stay out of the run
# fingerprint and a node can be added or lost without orphaning a run.
api_base = ["http://127.0.0.1:8222/v1"]
# Which OpenAI-compatible API those endpoints speak: "responses" (the default)
# or "chat_completions". vLLM serves both; some hosted providers only the
# second. Prefer "responses" where there is a choice -- it reports truncation
# explicitly and echoes back the sampling settings the server resolved, and on
# chat_completions `effective_sampling` in the manifest is empty for that
# reason, so pin temperature and top_p below if you switch.
# api = "chat_completions"
# Drop this line to discover the served model from /v1/models instead.
model = "deepseek-ai/DeepSeek-V4-Flash-0731"

# Pilot settings for reasoning on the granular v8 prompt. The cached prefix
# is about 85–90k tokens; serve with at least 196608 context tokens so this output
# budget and a transcript window fit. Reasoning shares max_output_tokens.
# Assess recall and validation losses on your own pilot before scaling up.
reasoning_effort = "high"
max_output_tokens = 44000
timeout = 1800
attempts = 3

# DeepSeek's recommended sampling for this checkpoint.
temperature = 1.0
top_p = 0.95

# Bearer auth, for a paid endpoint. This names the environment variable holding
# the key -- never the key itself, so nothing secret lands in this tracked file.
# The value is read from the environment, or from .env when the environment does
# not set it (see .env.example). Omitted, no Authorization header is sent at all,
# which is what the local vLLM nodes want.
#
# api_key_env = "FIREWORKS_API_KEY"
# env_file = ".env"

# A seed pins the sampler, but it also makes the `attempts` retries resend an
# identical payload, so a window rejected for its content tends to be rejected
# the same way every time rather than recovered by a different sample. Prefer it
# for a comparison run, not for a production pass.
# seed = 20260830

# Spending guards, for a run pointed at a paid endpoint instead of the local
# servers above. Shared by `label` and `verify`, and off while commented out --
# the vLLM nodes bill nothing. The limits themselves, and the prices the cost
# ones are computed from, live in analysis/usage-limits.toml.
#
# [usage]
# usage_limits = "analysis/usage-limits.toml"
# provider = "fireworks"
# experiment = "topic-pilot-a"

[label]
# One window per request; size concurrency for the configured servers.
# Failed responses are logged and retryable, rather than treated as negatives.
concurrency = 128
# One bad annotation still rejects the whole response and repeats a full
# reasoning pass. "lenient" repairs an annotation where the fix is unambiguous
# (a quote just outside its span widens the span) and drops it where it is not,
# counting both; "strict" is the default. See docs/labeling.md.
# validation = "lenient"

[verify]
concurrency = 8
