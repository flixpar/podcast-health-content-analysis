name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install audio and search tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - name: Install locked CPU test dependencies
        run: uv sync --locked --only-group test
      - name: Check maintained workflows
        run: |
          .venv/bin/python -m pytest
          git diff --exit-code
