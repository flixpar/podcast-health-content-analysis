name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install audio and search tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - name: Install locked CPU test dependencies
        run: uv sync --locked --only-group test
      - name: Check maintained workflows
        run: |
          .venv/bin/python -m pytest
          git diff --exit-code
